[workspace]
resolver = "3"
members = ["crates/pezo-core", "crates/pezo-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dominikos Pritis <hey@myroomie.gr>"]

[workspace.dependencies]
pezo-core = { path = "crates/pezo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
walkdir = "2.5.1"
rayon = "1.12"
ureq = { version = "3.5.2", features = ["json"] }
sha2 = "0.11.1"
clap = { version = "4.6.10", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
